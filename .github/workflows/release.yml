name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          name="zhihu-collection-export-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/zhihu-collection-export" "$name/"
          cp README.md "$name/"
          tar czf "$name.tar.gz" "$name"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "zhihu-collection-export-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name
          Copy-Item "target/${{ matrix.target }}/release/zhihu-collection-export.exe" "$name/"
          Copy-Item "README.md" "$name/"
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            zhihu-collection-export-*.tar.gz
            zhihu-collection-export-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: zhihu-collection-export ${{ github.ref_name }}
          body: |
            ## 下载

            | 平台 | 文件 |
            | --- | --- |
            | Linux x86_64 | `zhihu-collection-export-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz` |
            | Windows x86_64 | `zhihu-collection-export-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip` |

            压缩包内包含可执行文件和 README，解压后即可运行，不需要安装 Rust 工具链。

            ## 用法

            ```bash
            zhihu-collection-export 'https://www.zhihu.com/collection/997879559' -o exports
            ```

            完整说明见[项目文档](https://github.com/${{ github.repository }}#readme)。
          files: dist/*
